  <g stroke-width="1.7">
    <rect x="470" y="404" width="92" height="62" rx="9"/>
    <rect x="616" y="404" width="92" height="62" rx="9"/>
    <rect x="762" y="404" width="92" height="62" rx="9"/>
    <rect x="616" y="520" width="92" height="62" rx="9"/>
  </g>
  <g stroke-width="1.6">
