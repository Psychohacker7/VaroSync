<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="&quot;Latin Modern Math&quot;,&quot;STIX Two Math&quot;,&quot;Cambria Math&quot;,Georgia,serif">
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough-soft" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="smudge" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
  <radialGradient id="board" cx="42%" cy="34%" r="82%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="62%" stop-color="#fafaf8"/>
    <stop offset="100%" stop-color="#eeeeea"/>
  </radialGradient>
</defs>

<g id="bg">
  <rect width="1600" height="900" fill="url(#board)"/>
  <g filter="url(#smudge)" opacity="0.5">
    <ellipse cx="300" cy="700" rx="150" ry="42" fill="#fff"/>
    <ellipse cx="1180" cy="180" rx="190" ry="36" fill="#fff"/>
    <ellipse cx="720" cy="820" rx="220" ry="30" fill="#fff"/>
  </g>
</g>

<g fill="none" stroke="#1b1b1f" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)" opacity="0.9">

