</g>

<g filter="url(#rough-soft)" fill="#1b1b1f" font-style="italic" opacity="0.92">
  <!-- A -->
  <text x="86" y="332" font-size="27">K</text><text x="103" y="339" font-size="16" font-style="normal">d</text>
  <text x="117" y="332" font-size="27">= k</text><text x="158" y="339" font-size="16" font-style="normal">off</text>
  <text x="190" y="332" font-size="27">/ k</text><text x="223" y="339" font-size="16" font-style="normal">on</text>
  <text x="272" y="332" font-size="27">τ = 1/k</text><text x="360" y="339" font-size="16" font-style="normal">off</text>
  <text x="212" y="106" font-size="22" font-style="normal">‡</text>
  <text x="122" y="272" font-size="20">ΔG</text>

  <!-- B -->
  <text x="486" y="316" font-size="27">log k = α log K + ε</text>
  <text x="762" y="316" font-size="27" fill="#c8372d">ε</text>
  <text x="782" y="316" font-size="27">→ ?</text>
  <text x="806" y="150" font-size="20">ŷ</text>

  <!-- C -->
  <text x="1092" y="290" font-size="30" fill="#c8372d">?</text>
  <text x="928" y="322" font-size="26">N(x) ⊄ C(x)</text>
  <text x="1120" y="322" font-size="26">∂Ω</text>

  <!-- D -->
  <text x="1330" y="136" font-size="24">a</text><text x="1420" y="136" font-size="24">b</text>
  <text x="1330" y="192" font-size="24">c</text><text x="1420" y="192" font-size="24">d</text>
  <text x="1300" y="256" font-size="26">(a/b) / (c/d)</text>

  <!-- E -->
  <text x="80" y="640" font-size="27">Σ</text>
  <text x="98" y="648" font-size="15" font-style="normal">t</text>
  <text x="112" y="640" font-size="27">p</text><text x="128" y="648" font-size="15" font-style="normal">t</text>
  <text x="138" y="640" font-size="27">x</text><text x="152" y="648" font-size="15" font-style="normal">t</text>
  <text x="166" y="640" font-size="27">(1+r)</text>
  <text x="238" y="624" font-size="16" font-style="normal">−t</text>

  <!-- F -->
  <text x="504" y="444" font-size="27">Σ</text>
  <text x="646" y="444" font-size="27">∂</text><text x="662" y="452" font-size="15" font-style="normal">t</text>
  <text x="792" y="444" font-size="27">ƒ</text>
  <text x="648" y="560" font-size="27">⊗</text>
  <text x="396" y="442" font-size="24">x</text>
  <text x="902" y="442" font-size="24">ŷ</text>

  <!-- G -->
  <text x="1128" y="416" font-size="22">t*</text>
  <text x="916" y="648" font-size="26">(1 − δ)</text>
  <text x="1006" y="632" font-size="16" font-style="normal">t</text>

  <!-- H -->
  <text x="1272" y="628" font-size="27">Π</text>
  <text x="1292" y="636" font-size="15" font-style="normal">s</text>
  <text x="1306" y="628" font-size="27">p</text><text x="1322" y="636" font-size="15" font-style="normal">s</text>
  <text x="1348" y="628" font-size="27">, s = 1…n</text>

  <!-- bottom scatter of marks -->
  <text x="452" y="768" font-size="26">ρ ≈ 0.014</text>
  <text x="620" y="710" font-size="26">≠</text>
  <text x="866" y="704" font-size="30" fill="#c8372d">4.2×</text>
  <text x="852" y="770" font-size="24">ρ / ρ</text>
  <text x="1000" y="712" font-size="26">⟨ ε | K ⟩ → 0</text>
  <text x="1236" y="812" font-size="26">P(θ | D)</text>
  <text x="1424" y="812" font-size="24">θ̂</text>
  <text x="164" y="842" font-size="26">∇ · Φ = 0</text>
  <text x="300" y="700" font-size="26">∫ w(τ) dτ</text>
  <text x="300" y="758" font-size="26">A ⊗ B ≠ B ⊗ A</text>
</g>
</svg>
