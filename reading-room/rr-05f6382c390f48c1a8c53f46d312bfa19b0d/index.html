<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Varosync</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="pragma" content="no-cache" />
        <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
        <link href="https://fonts.cdnfonts.com/css/cabinet-grotesk" rel="stylesheet" />
        <link href="https://fonts.cdnfonts.com/css/satoshi" rel="stylesheet" />
        <style>
            :root{
                --paper:#f1e9d6; --ink:#15110b; --ink-2:#2b2519;
                --muted:#6b5d47; --muted-2:#918262; --rule:#c5b591; --rule-soft:#d8c9a8;
                --sepia:#856a3d; --oxblood:#6b2a1f;
                --font-heading:'Cabinet Grotesk','Product Sans',-apple-system,BlinkMacSystemFont,sans-serif;
                --font-body:'Satoshi','Product Sans',-apple-system,BlinkMacSystemFont,sans-serif;
            }
            *{box-sizing:border-box}
            .staticrypt-html{height:100%}
            .staticrypt-body{height:100%;margin:0}
            .staticrypt-content{
                height:100%;margin:0;background:var(--paper);
                font-family:var(--font-body);color:var(--ink);
                -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
                position:relative;
            }
            .gate-grain{
                position:fixed;inset:0;z-index:0;pointer-events:none;mix-blend-mode:multiply;opacity:.85;
                background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 0 0.16  0 0 0 0.08 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
            }
            @keyframes gate-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
            .staticrypt-page{
                position:relative;z-index:1;
                min-height:100%;display:flex;align-items:center;justify-content:center;
                padding:32px 22px;
            }
            .staticrypt-form{
                width:100%;max-width:384px;text-align:center;
                animation:gate-rise .6s cubic-bezier(.22,1,.36,1) both;
            }
            .gate-mark{width:30px;height:30px;color:var(--ink);margin:0 auto 26px}
            .gate-mark svg{width:100%;height:100%;display:block}
            .gate-eyebrow{
                font-size:11px;text-transform:uppercase;letter-spacing:.2em;
                color:var(--oxblood);font-weight:600;margin-bottom:16px;
            }
            .staticrypt-title{
                font-family:var(--font-heading);font-weight:400;font-size:1.3rem;
                line-height:1.1;letter-spacing:-.01em;color:var(--ink);margin:0 0 10px;
            }
            .staticrypt-instructions{margin:0 0 30px}
            .staticrypt-instructions p{
                font-size:14px;line-height:1.55;color:var(--muted);margin:0;
                max-width:300px;margin-left:auto;margin-right:auto;
            }
            .staticrypt-password-container{
                position:relative;display:flex;align-items:center;
                background:transparent;border-bottom:1px solid var(--rule);
                margin:0 0 22px;transition:border-color .2s ease;
            }
            .staticrypt-password-container:focus-within{border-color:var(--ink)}
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"]{
                flex:1;background:transparent;border:0;outline:0;
                font-family:var(--font-body);font-size:15px;color:var(--ink);
                letter-spacing:.06em;padding:13px 34px 13px 2px;width:100%;
            }
            .staticrypt-form input::placeholder{color:var(--muted-2);letter-spacing:.02em}
            .staticrypt-toggle-password-visibility{
                cursor:pointer;height:18px;width:18px;opacity:.5;
                position:absolute;right:2px;top:50%;transform:translateY(-50%);
            }
            .staticrypt-decrypt-button{
                width:100%;border:0;cursor:pointer;
                font-family:var(--font-body);font-size:14px;font-weight:600;letter-spacing:.02em;
                color:var(--paper);background:var(--ink);
                padding:14px;border-radius:999px;transition:background .2s ease;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus{background:var(--oxblood)}
            .gate-foot{
                margin-top:30px;font-size:11.5px;letter-spacing:.06em;color:var(--muted-2);
                font-variant-numeric:tabular-nums;
            }
            .staticrypt-remember{display:none}
            .hidden{display:none !important}
            /* loading spinner in ink */
            .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center;background:var(--paper)}
            .staticrypt-spinner{
                display:inline-block;width:1.75rem;height:1.75rem;
                border:.22em solid var(--rule);border-right-color:transparent;border-radius:50%;
                animation:gate-spin .75s linear infinite;
            }
            @keyframes gate-spin{100%{transform:rotate(360deg)}}
        </style>
    </head>
